<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SlakeyTV Player</title>
  <!-- Material Icons + Inter Font -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <!-- Player MD3 Style -->
  <link rel="stylesheet" href="player.css">
</head>
<body>

  <div class="loading" id="loading"><div class="spinner"></div></div>
  <div class="status info" id="status">正在初始化...</div>
  <!-- 错误状态面板 -->
  <div class="error-panel" id="errorPanel">
    <div class="error-panel-icon error" id="errorPanelIcon">
      <span class="material-icons-outlined">error_outline</span>
    </div>
    <div class="error-panel-title" id="errorPanelTitle">视频加载失败</div>
    <div class="error-panel-desc" id="errorPanelDesc">当前视频源无法正常播放</div>
    <div class="error-panel-actions" id="errorPanelActions"></div>
    <div class="error-panel-hint" id="errorPanelHint">点击画面其他区域可关闭此提示</div>
  </div>

  <div id="playerContainer">
    <canvas id="videoCanvas"></canvas>
    <video
      id="hiddenVideo"
      playsinline
      webkit-playsinline
      x5-playsinline
      x5-video-player-type="h5"
    ></video>

    <div class="controls" id="controls">
      <!-- 进度条 -->
      <div class="progress-container" id="progressContainer">
        <div class="progress-track" id="progressTrack">
          <div class="progress-buffer" id="progressBuffer"></div>
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="controls-row">
        <!-- 左侧：播放/暂停/快退快进/时间 -->
        <div class="controls-left">
          <button class="control-btn" id="playBtn" onclick="togglePlay()" title="播放/暂停">
            <span class="material-icons-outlined">play_arrow</span>
          </button>
          <button class="control-btn" onclick="seekRelative(-10)" title="后退10秒">
            <span class="material-icons-outlined">replay_10</span>
          </button>
          <button class="control-btn" onclick="seekRelative(10)" title="前进10秒">
            <span class="material-icons-outlined">forward_10</span>
          </button>

          <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
        </div>

        <!-- 中间：倍速 -->
        <div class="controls-center">
          <select class="speed-select" id="speedSelect" onchange="setSpeed(this.value)">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </div>

        <!-- 右侧：画质 + 全屏 + 关闭 -->
        <div class="controls-right">
          <select class="quality-select" id="qualitySelect" onchange="setQuality(this.value)">
            <option value="-1">自动</option>
          </select>
          <button class="control-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="全屏">
            <span class="material-icons-outlined">fullscreen</span>
          </button>
          <button class="control-btn" onclick="closePlayer()" title="关闭播放器" style="font-size:28px;">
            <span class="material-icons-outlined">close</span>
          </button>
        </div>
      </div>
    </div>
  </div>

<script>
let canvas = null, ctx = null, hiddenVideo = null;
let hls = null, isPlaying = false, animationFrameId = null;
let isFullscreen = false;
let videoNativeWidth = 0, videoNativeHeight = 0;
let _clickTimer = null; // 单击/双击区分定时器
let verticalPosition = 'center'; // 播放器垂直位置: top / center / bottom

function init() {
  canvas = document.getElementById('videoCanvas');
  ctx = canvas.getContext('2d');
  hiddenVideo = document.getElementById('hiddenVideo');
  hiddenVideo.muted = false;  // 允许有声播放

  // 默认显示控制栏
  document.getElementById('controls').classList.add('show');

  if (typeof Hls === 'undefined') { showStatus('错误: HLS.js 未加载', 'error'); return; }

  const urlParams = new URLSearchParams(window.location.search);
  const videoUrl = urlParams.get('url');
  verticalPosition = urlParams.get('vpos') || 'center';
  if (!videoUrl) { showStatus('未提供视频地址', 'info'); return; }
  showStatus('正在加载视频...', 'info');
  setTimeout(() => loadVideo(decodeURIComponent(videoUrl)), 300);

  hiddenVideo.addEventListener('loadedmetadata', () => {
    videoNativeWidth  = hiddenVideo.videoWidth;
    videoNativeHeight = hiddenVideo.videoHeight;
    onVideoReady();
  });
  hiddenVideo.addEventListener('canplay',     () => console.log('视频可以播放'));
  hiddenVideo.addEventListener('playing',      () => {
    isPlaying = true;
    document.getElementById('playBtn').innerHTML = '<span class="material-icons-outlined">pause</span>';
    hideStatus();
    renderFrame();
  });
  hiddenVideo.addEventListener('pause',       () => { isPlaying = false; document.getElementById('playBtn').innerHTML = '<span class="material-icons-outlined">play_arrow</span>'; });
  hiddenVideo.addEventListener('ended',       () => { isPlaying = false; document.getElementById('playBtn').innerHTML = '<span class="material-icons-outlined">play_arrow</span>'; cancelAnimationFrame(animationFrameId); });
  hiddenVideo.addEventListener('error',        (e) => { console.error('视频错误:', hiddenVideo.error); showStatus('播放错误，请检查地址', 'error'); hideLoading(); });

  hiddenVideo.addEventListener('timeupdate',   () => updateProgress());

  document.addEventListener('keydown', handleKeydown);

  // 鼠标移动 → 显示控制栏（桌面端），初始隐藏
  // 控制栏初始状态：隐藏，等用户单击画面才显示

  // 单击画面 → 切换控制栏显示/隐藏；双击 → 播放/暂停
  // 重要：即使在错误状态下也要响应点击
  canvas.addEventListener('click', (e) => {
    e.stopPropagation();
    // 如果错误面板打开，点击画面关闭它
    const errPanel = document.getElementById('errorPanel');
    if (errPanel && errPanel.classList.contains('show')) {
      hideErrorPanel();
      _clickTimer = setTimeout(() => { toggleControls(); _clickTimer = null; }, 300);
      return;
    }
    if (_clickTimer) clearTimeout(_clickTimer);
    _clickTimer = setTimeout(() => { toggleControls(); _clickTimer = null; }, 300);
  });
  canvas.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    if (_clickTimer) { clearTimeout(_clickTimer); _clickTimer = null; }
    togglePlay();
  });

  // 进度条点击（受 pointer-events 控制）
  document.getElementById('progressContainer').addEventListener('click', (e) => {
    seek(e);
  });
  // 防止控制栏内点击冒泡触发 toggle
  document.getElementById('controls').addEventListener('click', (e) => e.stopPropagation());

  window.addEventListener('resize',        resizeCanvas);
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));

  console.log('初始化完成');
}

/* ---------- 控制栏显示/隐藏 ---------- */
let controlsTimeout = null;

function toggleControls() {
  const c = document.getElementById('controls');
  // 即使在错误状态下也允许切换控制栏
  if (c.classList.contains('show')) {
    c.classList.remove('show');
  } else {
    c.classList.add('show');
    // 切换后重置自动隐藏定时器（仅非错误状态）
    if (!currentStatusType || !(currentStatusType === 'error' || currentStatusType === 'warn')) {
      resetControlsTimeout();
    }
  }
}
function resetControlsTimeout() {
  clearTimeout(controlsTimeout);
  controlsTimeout = setTimeout(() => {
    if (isPlaying) document.getElementById('controls').classList.remove('show');
  }, 4000);   // 4秒后自动隐藏
}

/* ---------- Canvas 尺寸（保持视频比例） ---------- */
function resizeCanvas() {
  if (!canvas || videoNativeWidth === 0) return;
  const container = document.getElementById('playerContainer');
  const cw = container.clientWidth, ch = container.clientHeight;
  const vRatio = videoNativeWidth / videoNativeHeight;
  const cRatio = cw / ch;
  let w, h;
  if (vRatio > cRatio) { w = cw; h = cw / vRatio; }
  else                   { h = ch; w = ch * vRatio; }
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width  = videoNativeWidth;
  canvas.height = videoNativeHeight;
  
  // 根据垂直位置设置 canvas 的定位
  if (h < ch) {
    let topPos;
    switch (verticalPosition) {
      case 'top':    topPos = 0; break;
      case 'bottom': topPos = ch - h; break;
      default:       topPos = (ch - h) / 2; break; // center
    }
    canvas.style.marginTop = topPos + 'px';
  } else {
    canvas.style.marginTop = '0';
  }
}

/* ---------- 键盘快捷键 ---------- */
function handleKeydown(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  switch(e.key) {
    case ' ': case 'Space':     e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft':           e.preventDefault(); seekRelative(-10); break;
    case 'ArrowRight':          e.preventDefault(); seekRelative(10); break;
    case 'f': case 'F':        e.preventDefault(); toggleFullscreen(); break;
    case '0': case '1': case '2': case '3': case '4':
    case '5': case '6': case '7': case '8': case '9':
      if (hiddenVideo.duration) hiddenVideo.currentTime = hiddenVideo.duration * parseInt(e.key) / 10;
      break;
  }
}

/* ---------- 状态提示 ---------- */
let currentStatusType = null;
let errorRetryCount = 0;
const MAX_ERROR_RETRY = 3;
let lastVideoUrl = '';

function showStatus(msg, type) {
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = 'status ' + type;
  s.style.display = 'block';
  currentStatusType = type;
  
  if (type === 'error' || type === 'warn') {
    showErrorPanel(msg, type);
    document.body.classList.add('error-state');
    document.getElementById('controls').classList.add('show');
    hideLoading();
  } else {
    hideErrorPanel();
    if (type !== 'info') {
      document.body.classList.remove('error-state');
    }
  }
}

function hideStatus() {
  document.getElementById('status').style.display = 'none';
  hideErrorPanel();
  document.body.classList.remove('error-state');
  currentStatusType = null;
}

// 显示错误面板（带操作按钮）
function showErrorPanel(msg, type) {
  const panel = document.getElementById('errorPanel');
  const iconEl = document.getElementById('errorPanelIcon');
  const titleEl = document.getElementById('errorPanelTitle');
  const descEl = document.getElementById('errorPanelDesc');
  const actionsEl = document.getElementById('errorPanelActions');
  const hintEl = document.getElementById('errorPanelHint');
  
  iconEl.className = 'error-panel-icon ' + type;
  titleEl.textContent = type === 'error' ? '视频加载失败' : '播放遇到问题';
  
  // 根据错误类型设置不同的描述和建议
  let desc = '';
  let hint = '';
  let actions = '';
  
  if (msg.includes('manifestLoadError') || msg.includes('MANIFEST')) {
    desc = '视频源列表文件（M3U8）无法加载，可能是源地址失效或服务器限制。';
    hint = '💡 建议：尝试切换到其他线路或画质选项，通常可以解决此类问题。';
    actions = `
      <button class="error-panel-btn primary" onclick="retryLoadVideo()">
        <span class="material-icons-outlined">refresh</span>重新加载
      </button>
      <button class="error-panel-btn secondary" onclick="closePlayer()">
        <span class="material-icons-outlined">close</span>返回选集
      </button>`;
  } else if (msg.includes('网络错误') || msg.includes('NETWORK_ERROR')) {
    desc = '网络连接不稳定或视频服务器暂时无响应。';
    hint = '💡 建议：检查网络连接后重试，或尝试切换到其他视频源。';
    actions = `
      <button class="error-panel-btn primary" onclick="retryLoadVideo()">
        <span class="material-icons-outlined">refresh</span>重新加载 (${MAX_ERROR_RETRY - errorRetryCount}/${MAX_ERROR_RETRY})
      </button>
      <button class="error-panel-btn secondary" onclick="closePlayer()">
        <span class="material-icons-outlined">close</span>返回选集
      </button>`;
  } else if (msg.includes('媒体格式') || msg.includes('MEDIA_ERROR')) {
    desc = '视频编码格式不受支持或媒体数据损坏。';
    hint = '💡 建议：尝试切换到不同画质的视频源（如从 1080p 切换到 720p）。';
    actions = `
      <button class="error-panel-btn primary" onclick="switchQualityFallback()">
        <span class="material-icons-outlined">tune</span>切换画质
      </button>
      <button class="error-panel-btn secondary" onclick="retryLoadVideo()">
        <span class="material-icons-outlined">refresh</span>重试
      </button>
      <button class="error-panel-btn danger" onclick="closePlayer()">
        <span class="material-icons-outlined">close</span>返回选集
      </button>`;
  } else {
    desc = msg || '未知错误，请稍后重试。';
    hint = '💡 如果问题持续存在，建议更换视频源或联系管理员。';
    actions = `
      <button class="error-panel-btn primary" onclick="retryLoadVideo()">
        <span class="material-icons-outlined">refresh</span>重新加载
      </button>
      <button class="error-panel-btn secondary" onclick="closePlayer()">
        <span class="material-icons-outlined">close</span>返回选集
      </button>`;
  }
  
  descEl.textContent = desc;
  hintEl.textContent = hint;
  actionsEl.innerHTML = actions;
  panel.classList.add('show');
}

function hideErrorPanel() {
  document.getElementById('errorPanel').classList.remove('show');
}

// 重试加载视频
function retryLoadVideo() {
  if (!lastVideoUrl) return;
  errorRetryCount++;
  hideErrorPanel();
  showLoading();
  showStatus('正在重新加载...', 'info');
  setTimeout(() => loadVideo(lastVideoUrl), 500);
}

// 切换画质作为降级方案
function switchQualityFallback() {
  const qSelect = document.getElementById('qualitySelect');
  if (qSelect && qSelect.options.length > 1) {
    // 尝试选择下一个画质
    const currentIndex = qSelect.selectedIndex;
    const nextIndex = (currentIndex + 1) % qSelect.options.length;
    if (nextIndex !== currentIndex) {
      qSelect.selectedIndex = nextIndex;
      setQuality(qSelect.value);
      showStatus('已切换画质，正在重新加载...', 'info');
      retryLoadVideo();
      return;
    }
  }
  // 没有可切换的画质，直接重试
  retryLoadVideo();
}
function showLoading() { document.getElementById('loading').style.display = 'block'; }
function hideLoading() { document.getElementById('loading').style.display = 'none'; }

/* ---------- 加载视频 ---------- */
function loadVideo(url) {
  if (!url) { showStatus('视频地址为空', 'error'); return; }
  lastVideoUrl = url; // 记住当前 URL 用于重试
  showLoading();
  try { loadHLSVideo(url); }
  catch(err) { console.error(err); showStatus('加载失败: '+err.message, 'error'); hideLoading(); }
}

function loadHLSVideo(url) {
  // 检测是否为 HLS 流（.m3u8）或普通视频文件
  const isHLS = url.includes('.m3u8') || url.includes('m3u8');
  
  if (!isHLS) {
    // 非 HLS 格式，直接使用原生 video 标签播放（支持 MP4/WebM 等）
    console.log('检测到非 HLS 格式，使用原生视频播放:', url);
    loadNativeVideo(url);
    return;
  }
  
  // HLS 流处理
  if (Hls.isSupported()) {
    if (hls) hls.destroy();
    hls = new Hls({ 
      debug: false,
      enableWorker: true,
      lowLatencyMode: false,
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      // 增强容错配置
      maxBufferHole: 0.5,
      maxFragLookUpTolerance: 0.2,
      xhrSetup: function(xhr) {
        // 设置超时时间
        xhr.timeout = 15000; // 15秒超时
      }
    });
    
    hls.on(Hls.Events.MEDIA_ATTACHED, () => console.log('HLS: Media attached'));
    
    hls.on(Hls.Events.MANIFEST_LOADED, (e,d) => {
      console.log('HLS: Manifest loaded, levels:', d.levels.length);
      if (d.levels.length > 1) {
        const q = document.getElementById('qualitySelect');
        q.innerHTML = '<option value="-1">自动</option>';
        d.levels.forEach((l,i) => q.innerHTML += '<option value="'+i+'">'+l.height+'p</option>');
        q.style.display = 'block';
      }
    });
    
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      hideLoading();
      showStatus('双击画面播放 · 单击显示控制栏', 'info');
    });
    
    hls.on(Hls.Events.ERROR, (e,d) => {
      console.error('HLS 错误:', d.type, d.details, d.fatal);
      
      if (d.fatal) {
        switch(d.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            console.log('网络错误，尝试恢复...');
            if (errorRetryCount < MAX_ERROR_RETRY) {
              showStatus('网络错误，正在重试...', 'warn');
              setTimeout(() => {
                if (hls) hls.startLoad();
              }, 1000);
            } else {
              showStatus('网络错误: 多次重试失败，请检查网络或更换视频源', 'error');
            }
            break;
            
          case Hls.ErrorTypes.MEDIA_ERROR:
            console.log('媒体错误，尝试恢复...');
            showStatus('媒体格式错误，尝试修复...', 'warn');
            hls.recoverMediaError();
            break;
            
          default:
            console.error('致命错误，销毁 HLS 实例');
            showStatus('无法加载视频流 (' + d.details + ')', 'error');
            hls.destroy();
            // 尝试降级到原生播放
            tryNativeFallback(url);
            break;
        }
      } else {
        // 非致命错误，记录但不影响播放
        console.warn('非致命 HLS 错误:', d.details);
      }
    });
    
    hls.loadSource(url);
    hls.attachMedia(hiddenVideo);
    
  } else if (hiddenVideo.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari/iOS 原生 HLS 支持
    console.log('使用 Safari 原生 HLS 支持');
    hiddenVideo.src = url;
  } else {
    // 浏览器不支持 HLS，尝试作为普通视频加载
    console.warn('浏览器不支持 HLS，尝试原生视频加载');
    tryNativeFallback(url);
  }
}

// 原生视频加载（用于 MP4/WebM 等格式）
function loadNativeVideo(url) {
  hideLoading();
  hiddenVideo.src = url;
  hiddenVideo.load();
  showStatus('双击画面播放 · 单击显示控制栏', 'info');
}

// 降级方案：当 HLS 失败时尝试原生播放
function tryNativeFallback(url) {
  console.log('尝试降级到原生视频播放...');
  showStatus('正在切换播放模式...', 'info');
  
  // 清理 HLS 实例
  if (hls) {
    hls.destroy();
    hls = null;
  }
  
  // 尝试直接设置 src
  try {
    hiddenVideo.src = url;
    hiddenVideo.load();
    hideLoading();
    showStatus('已切换到兼容模式', 'success');
  } catch(err) {
    console.error('降级失败:', err);
    showStatus('视频加载失败: 不支持的格式', 'error');
    hideLoading();
  }
}

/* ---------- 视频准备就绪 ---------- */
function onVideoReady() {
  hideLoading();
  document.getElementById('playerContainer').style.display = 'flex';
  resizeCanvas();
}

/* ---------- 渲染帧（保持宽高比） ---------- */
function renderFrame() {
  if (!isPlaying) return;
  try {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const vRatio = videoNativeWidth / videoNativeHeight;
    const cRatio = canvas.width / canvas.height;
    let dw, dh, dx, dy;
    if (vRatio > cRatio) { dw = canvas.width; dh = canvas.width / vRatio; }
    else                  { dh = canvas.height; dw = canvas.height * vRatio; }
    dx = (canvas.width  - dw) / 2;
    dy = (canvas.height - dh) / 2;
    ctx.drawImage(hiddenVideo, dx, dy, dw, dh);
  } catch(err) { console.error('渲染错误:', err.message); }
  animationFrameId = requestAnimationFrame(renderFrame);
}

/* ---------- 播放控制 ---------- */
function togglePlay() {
  if (!hiddenVideo) return;
  hideStatus();   // 用户点击后隐藏提示
  if (isPlaying) {
    hiddenVideo.pause();
    isPlaying = false;
    document.getElementById('playBtn').innerHTML = '<span class="material-icons-outlined">play_arrow</span>';
    cancelAnimationFrame(animationFrameId);
  } else {
    hiddenVideo.muted = false;
    hiddenVideo.play().then(() => {
      isPlaying = true;
      document.getElementById('playBtn').innerHTML = '<span class="material-icons-outlined">pause</span>';
      renderFrame();
    }).catch(err => {
      console.error('播放失败:', err.message);
      showStatus('播放失败: '+err.message, 'error');
    });
  }
}

function seek(e) {
  if (!hiddenVideo||!hiddenVideo.duration) return;
  const r= e.currentTarget.getBoundingClientRect();
  hiddenVideo.currentTime = ((e.clientX-r.left)/r.width)*hiddenVideo.duration;
}
function seekRelative(s) {
  if (!hiddenVideo||!hiddenVideo.duration) return;
  hiddenVideo.currentTime=Math.max(0,Math.min(hiddenVideo.duration,hiddenVideo.currentTime+s));
}
function updateProgress() {
  if (!hiddenVideo||!hiddenVideo.duration) return;
  document.getElementById('progressFill').style.width = (hiddenVideo.currentTime/hiddenVideo.duration*100)+'%';
  document.getElementById('timeDisplay').textContent = formatTime(hiddenVideo.currentTime)+' / '+formatTime(hiddenVideo.duration);
}
function setSpeed(s)  { if(hiddenVideo) hiddenVideo.playbackRate=parseFloat(s); }
function setQuality(l){
  if(!hls) return; l=parseInt(l); hls.currentLevel = (l===-1)?-1:l;
}

/* ---------- 全屏 ---------- */
function toggleFullscreen(){
  const c=document.getElementById('playerContainer');
  const btn = document.getElementById('fullscreenBtn');
  if(!isFullscreen){
    (c.requestFullscreen||c.webkitRequestFullscreen).call(c.requestFullscreen?c:c);
    c.classList.add('fullscreen'); isFullscreen=true;
    btn.innerHTML = '<span class="material-icons-outlined">fullscreen_exit</span>';
    setTimeout(resizeCanvas,350);
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen).call(document.exitFullscreen?document:document);
    c.classList.remove('fullscreen'); isFullscreen=false;
    btn.innerHTML = '<span class="material-icons-outlined">fullscreen</span>';
    setTimeout(resizeCanvas,350);
  }
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement){
    document.getElementById('playerContainer').classList.remove('fullscreen');
    isFullscreen=false;
    document.getElementById('fullscreenBtn').innerHTML = '<span class="material-icons-outlined">fullscreen</span>';
    setTimeout(resizeCanvas,100);
  }
});

/* ---------- 关闭播放器 ---------- */
function closePlayer() {
  // 通知父窗口关闭 iframe
  if (window.parent && window.parent !== window) {
    window.parent.postMessage('close-canvas-player', '*');
  }
  // 兜底：直接移除自己（如果是在 iframe 中）
  const iframe = window.frameElement;
  if (iframe) iframe.remove();
}

/* ---------- 工具 ---------- */
function formatTime(s){
  if(isNaN(s)) return '0:00';
  const m=Math.floor(s/60), sec=Math.floor(s%60);
  return m+':'+(sec<10?'0':'')+sec;
}

/* ---------- 清理 ---------- */
window.addEventListener('beforeunload',()=>{ if(hls)hls.destroy(); if(animationFrameId)cancelAnimationFrame(animationFrameId); });
window.addEventListener('DOMContentLoaded', init);
</script>
